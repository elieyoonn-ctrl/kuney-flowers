<!doctype html>
<!-- Throwaway harness for the 2D sprite trial: the three drawn blooms at
     size, and the same three stems on a turntable so the billboarding can be
     watched from every angle. Delete once the trial is settled. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>KUNEY — vector sprite trial</title>
<style>
  body { margin: 0; background: #17171a; color: #d9d4c9; font: 13px/1.5 ui-sans-serif, system-ui; }
  header { padding: 18px 22px 6px; }
  h1 { font: 500 15px/1 ui-sans-serif; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; }
  p { margin: 0; color: #8d887e; max-width: 60ch; }
  .sheets { display: flex; gap: 22px; padding: 18px 22px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; color: #8d887e; letter-spacing: .06em; }
  /* Checker so the alpha cut-out and any fringing are visible. */
  canvas.sheet {
    width: 220px; height: 220px; border-radius: 3px;
    background-color: #2a2a2e;
    background-image:
      linear-gradient(45deg, #34343a 25%, transparent 25%, transparent 75%, #34343a 75%),
      linear-gradient(45deg, #34343a 25%, transparent 25%, transparent 75%, #34343a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #stage { width: 100%; height: 62vh; display: block; }
</style>
</head>
<body>
<header>
  <h1>Vector sprite trial</h1>
  <p>Top: the drawn texture, on a checker so the alpha edge shows. Below: the
     real stems from <code>createStem</code>, turntabling — the blooms should
     hold their face while the leaves and stems turn.</p>
</header>
<div class="sheets" id="sheets"></div>
<canvas id="stage"></canvas>

<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createStem } from './js/flowers.js';
import { spriteHead } from './js/flower-sprites.js';
import { RECIPES } from './js/flowers.js';
import { seeded } from './js/geometry.js';

const TRIAL = [
  { id: 'rose', hex: '#e8899b', label: 'Garden Rose' },
  { id: 'craspedia', hex: '#f2c01e', label: 'Craspedia' },
  { id: 'tropical', hex: '#c62430', label: 'Anthurium' },
];

/* --- the drawn sheets --------------------------------------------------- */

const sheets = document.getElementById('sheets');
for (const { id, hex, label } of TRIAL) {
  for (const openness of [1, 0.3]) {
    const sprite = spriteHead(id, RECIPES[id].sprite, hex, { openness });
    const src = sprite.material.map.image;
    const canvas = document.createElement('canvas');
    canvas.className = 'sheet';
    canvas.width = src.width;
    canvas.height = src.height;
    canvas.getContext('2d').drawImage(src, 0, 0);
    const fig = document.createElement('figure');
    fig.append(canvas);
    const cap = document.createElement('figcaption');
    cap.textContent = `${label} — ${openness === 1 ? 'open' : 'bud'}`;
    fig.append(cap);
    sheets.append(fig);
  }
}

/* --- the turntable ------------------------------------------------------ */

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1d1d20');
scene.add(new THREE.HemisphereLight(0xf3ead8, 0x3a3630, 2.2));
const key = new THREE.DirectionalLight(0xfff3e2, 2.4);
key.position.set(-1.4, 2.2, 1.6);
scene.add(key);

TRIAL.forEach(({ id, hex }, i) => {
  const stem = createStem(id, hex, { rng: seeded(4 + i), openness: 0.95 });
  stem.position.x = (i - 1) * 0.26;
  scene.add(stem);
});

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 20);
const target = new THREE.Vector3(0, 0.42, 0);

function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop((ms) => {
  const t = ms * 0.00022;
  camera.position.set(Math.sin(t) * 1.15, 0.52 + Math.sin(t * 0.7) * 0.12, Math.cos(t) * 1.15);
  camera.lookAt(target);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
